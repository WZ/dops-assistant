<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" font-family="'SF Mono', 'Cascadia Code', 'Fira Code', monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1117"/>
      <stop offset="100%" stop-color="#1a1d27"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="200" rx="12" fill="url(#bg)"/>

  <!-- Accent line -->
  <rect x="0" y="0" width="900" height="3" rx="1" fill="#f59e0b" opacity="0.6"/>

  <!-- Logo / brand mark -->
  <text x="80" y="105" fill="#f59e0b" font-size="48" font-weight="bold" filter="url(#glow)">▸</text>
  <text x="130" y="105" fill="#e5e7eb" font-size="40" font-weight="bold">dops-assistant</text>

  <!-- Tagline -->
  <text x="130" y="140" fill="#6b7280" font-size="16">AI-powered root cause analysis for DevOps</text>

  <!-- Right side: decorative pipeline hint -->
  <g opacity="0.4">
    <rect x="600" y="60" width="80" height="28" rx="4" fill="none" stroke="#6366f1" stroke-width="1"/>
    <text x="640" y="79" text-anchor="middle" fill="#6366f1" font-size="9">prefetch</text>

    <line x1="680" y1="74" x2="700" y2="74" stroke="#f59e0b" stroke-width="1"/>

    <rect x="700" y="60" width="80" height="28" rx="4" fill="none" stroke="#8b5cf6" stroke-width="1"/>
    <text x="740" y="79" text-anchor="middle" fill="#8b5cf6" font-size="9">anomaly</text>

    <line x1="780" y1="74" x2="800" y2="74" stroke="#f59e0b" stroke-width="1"/>

    <rect x="800" y="60" width="70" height="28" rx="4" fill="none" stroke="#ec4899" stroke-width="1"/>
    <text x="835" y="79" text-anchor="middle" fill="#ec4899" font-size="9">plan</text>

    <line x1="740" y1="88" x2="740" y2="108" stroke="#f59e0b" stroke-width="1"/>

    <rect x="620" y="108" width="70" height="24" rx="4" fill="none" stroke="#22d3ee" stroke-width="1"/>
    <text x="655" y="124" text-anchor="middle" fill="#22d3ee" font-size="8">metrics</text>

    <rect x="700" y="108" width="55" height="24" rx="4" fill="none" stroke="#a78bfa" stroke-width="1"/>
    <text x="728" y="124" text-anchor="middle" fill="#a78bfa" font-size="8">logs</text>

    <rect x="765" y="108" width="55" height="24" rx="4" fill="none" stroke="#f97316" stroke-width="1"/>
    <text x="793" y="124" text-anchor="middle" fill="#f97316" font-size="8">infra</text>

    <line x1="740" y1="132" x2="740" y2="148" stroke="#f59e0b" stroke-width="1"/>

    <rect x="690" y="148" width="100" height="28" rx="4" fill="none" stroke="#10b981" stroke-width="1"/>
    <text x="740" y="167" text-anchor="middle" fill="#10b981" font-size="9">synthesis</text>
  </g>
</svg>
