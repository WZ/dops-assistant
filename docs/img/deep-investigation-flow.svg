<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 820" font-family="'SF Mono', 'Cascadia Code', 'Fira Code', monospace" font-size="13">
  <defs>
    <marker id="arr" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 3.5 L 0 7" fill="#f59e0b"/>
    </marker>
    <marker id="arr-good" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 3.5 L 0 7" fill="#10b981"/>
    </marker>
    <marker id="arr-dim" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 3.5 L 0 7" fill="#6b7280"/>
    </marker>
    <marker id="arr-loop" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 3.5 L 0 7" fill="#22d3ee"/>
    </marker>
    <filter id="gl">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="loop-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1a1d"/>
      <stop offset="100%" stop-color="#161a24"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1120" height="820" rx="12" fill="#0f1117"/>

  <!-- Title -->
  <text x="440" y="38" text-anchor="middle" fill="#e5e7eb" font-size="18" font-weight="bold">Deep Investigation — the Autonomous Move-Loop</text>
  <text x="440" y="60" text-anchor="middle" fill="#6b7280" font-size="11">decide → act, one read-only move per turn, until a cause is deterministically confirmed — or a guard stops it</text>

  <!-- ═══ Entry ═══ -->
  <rect x="268" y="80" width="344" height="58" rx="8" fill="#1e293b" stroke="#f97316" stroke-width="2" filter="url(#gl)"/>
  <text x="290" y="101" fill="#f97316" font-size="9" font-weight="bold">OPERATOR · INVESTIGATE DEEPLY</text>
  <text x="440" y="123" text-anchor="middle" fill="#fdba74" font-size="11">Challenge this RCA &#160;|&#160; Full deep investigation</text>

  <!-- entry → loop -->
  <line x1="440" y1="138" x2="440" y2="166" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ═══ Move loop container ═══ -->
  <rect x="60" y="168" width="760" height="418" rx="12" fill="url(#loop-bg)" stroke="#22d3ee" stroke-width="1.5" stroke-opacity="0.6"/>
  <rect x="330" y="156" width="220" height="22" rx="4" fill="#22d3ee"/>
  <text x="440" y="172" text-anchor="middle" fill="#0f1117" font-size="11" font-weight="bold">THE MOVE LOOP · read-only</text>

  <!-- ① Guards -->
  <rect x="180" y="196" width="480" height="62" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2" filter="url(#gl)"/>
  <text x="202" y="217" fill="#f59e0b" font-size="9" font-weight="bold">① SAFETY GUARDS — checked before every move</text>
  <text x="420" y="240" text-anchor="middle" fill="#fcd34d" font-size="11">budget · tool-cap · wall-clock · strikes · stall · watchdog · abort</text>

  <!-- guards → decide -->
  <line x1="420" y1="258" x2="420" y2="288" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ② decideMove -->
  <rect x="300" y="290" width="240" height="50" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="2" filter="url(#gl)"/>
  <text x="420" y="311" text-anchor="middle" fill="#a5b4fc" font-size="12" font-weight="bold">② decideMove</text>
  <text x="420" y="328" text-anchor="middle" fill="#6b7280" font-size="9">the LLM brain picks ONE move</text>

  <!-- decide → moves -->
  <line x1="420" y1="340" x2="420" y2="366" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ③ Moves -->
  <rect x="92" y="368" width="656" height="150" rx="8" fill="#13151f" stroke="#2d3348" stroke-width="1"/>
  <text x="108" y="386" fill="#6b7280" font-size="9" font-weight="bold">③ PICK ONE MOVE</text>

  <!-- move chips: row 1 -->
  <rect x="108" y="394" width="200" height="44" rx="6" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.3"/>
  <text x="120" y="412" fill="#c4b5fd" font-size="11" font-weight="bold">hypothesize</text>
  <text x="120" y="428" fill="#6b7280" font-size="9">candidate cause + prediction</text>

  <rect x="320" y="394" width="200" height="44" rx="6" fill="#1e293b" stroke="#22d3ee" stroke-width="1.3"/>
  <text x="332" y="412" fill="#5eead4" font-size="11" font-weight="bold">query</text>
  <text x="332" y="428" fill="#6b7280" font-size="9">read-only evidence</text>

  <rect x="532" y="394" width="200" height="44" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.3"/>
  <text x="544" y="412" fill="#6ee7b7" font-size="11" font-weight="bold">test</text>
  <text x="544" y="428" fill="#6b7280" font-size="9">score vs the keystone</text>

  <!-- move chips: row 2 -->
  <rect x="108" y="448" width="200" height="44" rx="6" fill="#1e293b" stroke="#f97316" stroke-width="1.3"/>
  <text x="120" y="466" fill="#fdba74" font-size="11" font-weight="bold">spawn-subagent</text>
  <text x="120" y="482" fill="#6b7280" font-size="9">depth-1 quick investigation</text>

  <rect x="320" y="448" width="200" height="44" rx="6" fill="#1e293b" stroke="#f97316" stroke-width="1.3"/>
  <text x="332" y="466" fill="#fdba74" font-size="11" font-weight="bold">follow-cause</text>
  <text x="332" y="482" fill="#6b7280" font-size="9">a dependency neighbor only</text>

  <rect x="532" y="448" width="200" height="44" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="544" y="466" fill="#fcd34d" font-size="11" font-weight="bold">conclude</text>
  <text x="544" y="482" fill="#6b7280" font-size="9">propose done → ④</text>

  <!-- loop-back edge: moves → guards (left rail) -->
  <path d="M 100 416 C 74 416 74 227 178 227" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-loop)"/>
  <text x="70" y="330" fill="#22d3ee" font-size="9" transform="rotate(-90 70 330)" text-anchor="middle">next move</text>

  <!-- ═══ ④ Hybrid stop (keystone) ═══ -->
  <line x1="632" y1="492" x2="632" y2="630" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="250" y="632" width="404" height="66" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2" filter="url(#gl)"/>
  <text x="272" y="653" fill="#10b981" font-size="9" font-weight="bold">④ HYBRID STOP — the keystone</text>
  <text x="452" y="673" text-anchor="middle" fill="#6ee7b7" font-size="11">leading hypothesis verdict == satisfied?</text>
  <text x="452" y="689" text-anchor="middle" fill="#6b7280" font-size="9">self-reported confidence is recorded, never the gate</text>

  <!-- keystone NO → keep looking (back to loop) -->
  <path d="M 250 665 C 150 665 150 600 100 525" fill="none" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arr-dim)"/>
  <text x="150" y="640" fill="#6b7280" font-size="9" text-anchor="middle">no → keep looking</text>

  <!-- keystone YES → confirmed -->
  <line x1="654" y1="665" x2="708" y2="665" stroke="#10b981" stroke-width="1.6" marker-end="url(#arr-good)"/>

  <!-- ═══ Outcomes (right column) ═══ -->
  <!-- guard trips → outcomes -->
  <rect x="858" y="196" width="232" height="160" rx="8" fill="#13151f" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.6"/>
  <text x="874" y="216" fill="#f59e0b" font-size="9" font-weight="bold">GUARD TRIPS →</text>
  <text x="874" y="240" fill="#9ca3af" font-size="10.5">· budget-exhausted</text>
  <text x="874" y="262" fill="#9ca3af" font-size="10.5">· tool-cap</text>
  <text x="874" y="284" fill="#9ca3af" font-size="10.5">· wall-clock</text>
  <text x="874" y="306" fill="#9ca3af" font-size="10.5">· inconclusive  (stall)</text>
  <text x="874" y="328" fill="#9ca3af" font-size="10.5">· exhausted  (no moves)</text>
  <text x="874" y="348" fill="#9ca3af" font-size="10.5">· aborted  (disconnect)</text>
  <line x1="660" y1="216" x2="856" y2="240" stroke="#f59e0b" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arr)"/>

  <!-- strikes → operator-pause -->
  <rect x="858" y="380" width="232" height="96" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="874" y="401" fill="#f59e0b" font-size="9" font-weight="bold">⚠ STRIKES ≥ max</text>
  <text x="974" y="424" text-anchor="middle" fill="#fcd34d" font-size="12" font-weight="bold">OPERATOR-PAUSE</text>
  <text x="974" y="444" text-anchor="middle" fill="#9ca3af" font-size="9.5">hands an ambiguous call</text>
  <text x="974" y="459" text-anchor="middle" fill="#9ca3af" font-size="9.5">back to a human:</text>
  <text x="974" y="472" text-anchor="middle" fill="#6b7280" font-size="9">continue · escalate · wait</text>
  <line x1="660" y1="232" x2="858" y2="412" stroke="#f59e0b" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arr)"/>

  <!-- ═══ CONFIRMED outcome ═══ -->
  <rect x="710" y="630" width="380" height="120" rx="10" fill="#0e1f18" stroke="#10b981" stroke-width="2" filter="url(#gl)"/>
  <text x="730" y="652" fill="#10b981" font-size="11" font-weight="bold">✓ CONFIRMED</text>
  <line x1="728" y1="660" x2="1072" y2="660" stroke="#1f3d30" stroke-width="1"/>
  <text x="730" y="680" fill="#6ee7b7" font-size="10.5">Causal chain — incident → followed deps</text>
  <text x="730" y="697" fill="#6ee7b7" font-size="10.5">→ root cause (+ Grafana deep-link)</text>
  <text x="730" y="719" fill="#9ca3af" font-size="10">Trace summary · cross-service guard</text>
  <text x="730" y="735" fill="#9ca3af" font-size="10">→ operator "Apply to report"</text>

  <!-- Footer -->
  <text x="560" y="800" text-anchor="middle" fill="#374151" font-size="10">dops-assistant · Deep Investigation (autonomous orchestrator) · gated off until live validation</text>
</svg>
