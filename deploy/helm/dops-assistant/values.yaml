# Default values for dops-assistant.
# Override with `helm install ... -f my-values.yaml` or `--set` flags.

# -- Container image. repository is a placeholder; set this to your registry.
image:
  repository: dops-assistant
  # tag defaults to .Chart.AppVersion when empty.
  tag: ""
  # Always re-pull on pod start. This costs a few seconds on rollout, but
  # guarantees that re-pushing under a fixed tag (e.g. 0.1.4) actually picks
  # up the new digest instead of reusing the node's cached copy. If you don't
  # re-push tags, IfNotPresent is fine and slightly faster.
  pullPolicy: Always

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# dops-assistant keeps state in a local SQLite file, so replicaCount MUST stay at 1
# and the rollout strategy must be Recreate. The chart does not support HA.
replicaCount: 1
strategy:
  type: Recreate

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

# Example for running as non-root with the `node` user baked into node:22-alpine:
#   podSecurityContext:
#     fsGroup: 1000
#   securityContext:
#     runAsUser: 1000
#     runAsNonRoot: true
podSecurityContext: {}
securityContext: {}

# Pod-level /etc/hosts entries. Use when the LLM endpoint or an MCP server
# is reachable only by IP and the cluster DNS can't resolve the hostname.
# Format matches Kubernetes PodSpec.hostAliases.
hostAliases: []
# - ip: 10.0.0.42
#   hostnames:
#     - llm.internal.example

service:
  type: ClusterIP
  httpPort: 3000
  metricsPort: 9090
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  # WebSocket-friendly timeouts (discovery LLM calls can take 60-90s):
  # nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
  # nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
  # nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
  #
  # Sub-path deploys (serving at e.g. https://host/dops/):
  #   1. Build the image with `--build-arg VITE_BASE_PATH=/dops/` (matching the
  #      ingress path). Without this, the browser requests assets at `/assets/*`
  #      instead of `/dops/assets/*` and loads a blank page.
  #   2. Configure the ingress to rewrite `/dops/*` → `/*` before forwarding,
  #      so the server's `/ws` and `/api/*` routes still resolve. Example:
  #      nginx.ingress.kubernetes.io/rewrite-target: /$2
  #      (and set the path to `/dops(/|$)(.*)` with pathType: ImplementationSpecific)
  # - kubernetes.io/ingress.class: nginx
  # - cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: dops.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # - secretName: dops-tls
  #   hosts:
  #     - dops.example.com

persistence:
  enabled: true
  # Mount path inside the container. This holds dops.sqlite, services.yaml,
  # providers.yaml, memory.db, data/{slug}/*, plus the rendered config.yaml.
  mountPath: /app/data
  size: 2Gi
  # Leave empty to use the cluster default StorageClass.
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  annotations: {}
  # If set, chart will use this PVC instead of creating one.
  existingClaim: ""

resources: {}
# Example:
#   resources:
#     requests:
#       cpu: 250m
#       memory: 512Mi
#     limits:
#       cpu: 2000m
#       memory: 2Gi

nodeSelector: {}
tolerations: []
affinity: {}

probes:
  liveness:
    path: /api/health
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /api/health
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

# Extra non-secret env vars (array of {name, value} objects).
env: []
# - name: LOG_LEVEL
#   value: info
#
# TRUST_PROXY_HOPS controls Express's `trust proxy` setting, which decides how
# req.ip is resolved from X-Forwarded-For (affects per-client rate limiting).
# Default is 1 (single k8s ingress hop that overwrites XFF). Set to:
#   - 1 : single ingress that overwrites XFF (nginx-ingress default)
#   - 2 : ingress + upstream CDN, or ingress + service mesh
# WARNING: too-high values let clients spoof XFF and bypass rate limits.
# - name: TRUST_PROXY_HOPS
#   value: "1"

# Additional envFrom sources (array of {secretRef|configMapRef}) appended to
# the container's envFrom. Use this to pull env vars from Kubernetes Secrets
# or ConfigMaps that already exist in the cluster, without adding them to the
# chart-managed Secret. Keys become env vars inside the container, available
# for ${VAR} substitution in config.yaml the same way as `secrets.data` entries.
#
# Typical use: SMTP credentials for email notifications stored in an existing
# Secret (e.g. managed by Vault / External Secrets Operator). The secret must
# define SMTP_USER and SMTP_PASS keys to match the ${SMTP_USER} / ${SMTP_PASS}
# references in `config.notifications.email.smtp`.
#
# extraEnvFrom:
#   - secretRef:
#       name: dops-smtp-credentials
extraEnvFrom: []

# ---------------------------------------------------------------------------
# Secrets
# ---------------------------------------------------------------------------
# Chart creates an Opaque Secret unless `existingSecret` is set. Keys in
# `secrets.data` are exposed to the pod via envFrom, so config.yaml can
# reference them with ${VAR} substitution.
secrets:
  create: true
  existingSecret: ""
  annotations: {}
  # stringData — keys become env vars.
  data:
    OPENAI_API_KEY: ""
    OPENAI_API_URL: "https://api.openai.com/v1"
    OPENAI_API_MODEL: "gpt-4o-mini"
    # Optional — only needed if you use a Grafana MCP provider
    # GRAFANA_URL: ""
    # GRAFANA_SERVICE_ACCOUNT_TOKEN: ""

# ---------------------------------------------------------------------------
# config.yaml (rendered into a ConfigMap, mirrors src/config/schema.ts)
# ---------------------------------------------------------------------------
# This block is written verbatim into a ConfigMap key named `config.yaml`.
# The init container copies it onto the PVC at startup so services.yaml
# (which the loader expects as a sibling of config.yaml) is writable.
#
# `${VAR}` and `${VAR:-default}` are resolved at runtime from env vars
# supplied via `secrets.data` or `env` (see src/config/loader.ts).
config:
  llm:
    apiKey: ${OPENAI_API_KEY}
    baseURL: ${OPENAI_API_URL:-https://api.openai.com/v1}
    model: ${OPENAI_API_MODEL:-gpt-4o-mini}

  # MCP providers — each one backs a role (metrics, logs, dashboards, ...).
  # See README for examples.
  providers: []
  # - name: grafana
  #   roles: [metrics, logs, dashboards]
  #   mcpServer:
  #     transport: http
  #     url: http://grafana-mcp.default.svc.cluster.local:8000/mcp

  # Static service catalog. Discovery can also populate services.yaml on the PVC.
  services: []

  # Keep memory.db on the PVC so it persists across restarts.
  memory:
    storage: libsql
    dbPath: /app/data/memory.db

  # Keep operator-added skill markdown files on the PVC. The schema default
  # is `./skills` which resolves to /app/skills (cwd) — ephemeral container
  # storage that gets wiped on pod restart. The init container ensures this
  # directory exists.
  skills:
    dir: /app/data/skills

  observability:
    port: 9090
    logLevel: info

  # Email notifications (optional). Enable to send investigation-complete
  # emails via SMTP. Reference secret env vars with ${VAR}; supply them via
  # `secrets.data` or `extraEnvFrom` (an existing k8s Secret).
  #
  # notifications:
  #   email:
  #     enabled: true
  #     smtp:
  #       host: smtp.gmail.com
  #       port: 587
  #       secure: false                # true only for port 465 (implicit TLS)
  #       user: ${SMTP_USER}
  #       pass: ${SMTP_PASS}
  #     from: "Ops Assistant <${SMTP_USER}>"   # Gmail requires From == user
  #     appBaseUrl: https://assistant.example.com

# ---------------------------------------------------------------------------
# providers.yaml (rendered into the same ConfigMap as config.yaml)
# ---------------------------------------------------------------------------
# An array of MCP provider configs matching ProviderSchema in
# src/config/schema.ts. The init container stages this into
# /app/data/default/providers.yaml on every pod start, so Helm-declared
# providers survive pod restarts even when persistence is disabled.
#
# Format is a flat array — do NOT wrap in a `providers:` key. If you're
# adding providers via the GUI instead, leave this as [] and turn on
# persistence so providers.yaml survives on a PVC.
providers: []
# - name: grafana
#   roles: [metrics, logs, dashboards]
#   mcpServer:
#     transport: http
#     url: http://grafana-mcp.default.svc.cluster.local:8000/mcp
