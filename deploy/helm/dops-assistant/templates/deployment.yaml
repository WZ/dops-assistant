apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dops-assistant.fullname" . }}
  labels:
    {{- include "dops-assistant.labels" . | nindent 4 }}
spec:
  # SQLite-backed state means replicas must stay at 1 and strategy must be Recreate.
  replicas: 1
  strategy:
    type: {{ .Values.strategy.type }}
  selector:
    matchLabels:
      {{- include "dops-assistant.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dops-assistant.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # Roll pods when config changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "dops-assistant.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # The config loader expects services.yaml next to config.yaml in a
        # writable directory (src/config/loader.ts). ConfigMaps are read-only,
        # so we copy the rendered config onto the data volume at startup.
        #
        # providers.yaml handling:
        #   - If persistence is on AND a GUI-populated providers.yaml exists
        #     on the PVC, leave it alone (operator-added providers survive
        #     restarts).
        #   - Otherwise, stage the Helm-declared providers (non-empty config
        #     providers, or first-boot default).
        #   - Empty "[]" from Helm never overwrites a non-empty PVC file.
        - name: init-config
          image: {{ include "dops-assistant.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -e
              cp /config-src/config.yaml {{ .Values.persistence.mountPath }}/config.yaml
              mkdir -p {{ .Values.persistence.mountPath }}/default
              TARGET={{ .Values.persistence.mountPath }}/default/providers.yaml
              SOURCE=/config-src/providers.yaml
              # Does the file declare at least one provider? Accept both YAML
              # block style (`- name: foo`) and flow style (`[{name: foo}]`).
              has_content() {
                [ -s "$1" ] && grep -qE '(^\s*-\s)|(\[[^]]+\])' "$1"
              }
              SOURCE_HAS_CONTENT=0
              has_content "$SOURCE" && SOURCE_HAS_CONTENT=1
              TARGET_HAS_CONTENT=0
              has_content "$TARGET" && TARGET_HAS_CONTENT=1
              if [ "$SOURCE_HAS_CONTENT" = "1" ]; then
                # Helm declares providers: source of truth wins.
                cp "$SOURCE" "$TARGET"
                echo "init-config: staged Helm providers to $TARGET"
              elif [ "$TARGET_HAS_CONTENT" = "0" ]; then
                # Neither side has content — write the empty list so the file exists.
                if [ -f "$SOURCE" ]; then
                  cp "$SOURCE" "$TARGET"
                else
                  echo "[]" > "$TARGET"
                fi
                echo "init-config: wrote empty providers.yaml (first boot)"
              else
                echo "init-config: preserved existing providers.yaml on PVC ($TARGET)"
              fi
          volumeMounts:
            - name: config
              mountPath: /config-src
              readOnly: true
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      containers:
        - name: dops-assistant
          image: {{ include "dops-assistant.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.httpPort }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}
              protocol: TCP
          env:
            - name: CONFIG_PATH
              value: {{ printf "%s/config.yaml" .Values.persistence.mountPath | quote }}
            - name: PORT
              value: {{ .Values.service.httpPort | quote }}
            - name: DB_PATH
              value: {{ printf "%s/dops.sqlite" .Values.persistence.mountPath | quote }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "dops-assistant.secretName" . }}
                optional: {{ not (or .Values.secrets.create .Values.secrets.existingSecret) }}
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "dops-assistant.configMapName" . }}
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "dops-assistant.pvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
