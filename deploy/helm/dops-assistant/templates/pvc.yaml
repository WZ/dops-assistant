{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "dops-assistant.pvcName" . }}
  labels:
    {{- include "dops-assistant.labels" . | nindent 4 }}
  annotations:
    # Survive `helm uninstall` and atomic-rollback purges so SQLite state,
    # services.yaml, and operator-added providers.yaml are not wiped on
    # release teardown. Override per-deploy via persistence.annotations.
    helm.sh/resource-policy: keep
    {{- with .Values.persistence.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  accessModes:
    {{- range .Values.persistence.accessModes }}
    - {{ . | quote }}
    {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
{{- end }}
