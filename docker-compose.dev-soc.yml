services:
  grafana-mcp:
    image: docker.io/grafana/mcp-grafana:latest
    entrypoint: ["/app/mcp-grafana", "--transport", "streamable-http", "--address", "0.0.0.0:8000", "--debug", "--log-level", "debug", "-tls-skip-verify"]
    restart: "no"
    env_file: dev-soc/.env
    ports:
      - "8000:8000"   # optional: expose for local curl/healthz checks


  kubernetes-mcp:
    image: ghcr.io/containers/kubernetes-mcp-server:latest
    command: ["--port", "8080", "--kubeconfig", "/kubeconfig/config.yml", "--read-only"]
    restart: "no"
    volumes:
      - ./dev-soc/k8s_config/k8s-fotisoc-staging-sanjose-a.yml:/kubeconfig/config.yml:ro
    ports:
      - "8001:8080"

