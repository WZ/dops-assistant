# fly.toml — dops-assistant public demo site.
#
# This is the Fly.io manifest for the public read-only demo. It mounts an
# ephemeral volume at /data for the seed database, sets DEMO_MODE=true,
# and serves the web UI on port 80. One shared-cpu-1x VM is more than
# enough: all writes are blocked, background jobs are disabled, traffic
# is GET-dominated, and the DB is 256 KB seeded.
#
# Before first deploy:
#   flyctl auth login
#   flyctl launch --dockerfile Dockerfile.demo --no-deploy --name dops-assistant-demo
#   flyctl volumes create dops_demo_data --size 1 --region ord
#   flyctl deploy --dockerfile Dockerfile.demo

app = "dops-assistant-demo"
primary_region = "ord"        # change to taste — Fly auto-provisions region routing

[build]
  dockerfile = "Dockerfile.demo"

[env]
  # DEMO_MODE is baked into the image as well, but setting it here makes the
  # public demo's intent visible in `flyctl config show`. No OPENAI_API_KEY.
  DEMO_MODE = "true"
  DATA_DIR = "/data"
  DB_PATH = "/data/dops.sqlite"
  CONFIG_PATH = "/app/demo/config.yaml"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"    # scale to zero when idle — no one's looking
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    protocol = "http"
    timeout = "5s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

# Mount an ephemeral volume for the SQLite seed DB. The seed script runs on
# every container start and rewrites this, so durability isn't important —
# but keeping it on a volume avoids cold-start rebuild cost on every wake.
[mounts]
  source = "dops_demo_data"
  destination = "/data"
