services:
  grafana-mcp:
    image: docker.io/grafana/mcp-grafana:latest
    entrypoint: ["/app/mcp-grafana", "--transport", "streamable-http", "--address", "0.0.0.0:8000", "--debug", "--log-level", "debug", "-tls-skip-verify"]
    restart: "no"
    env_file: dev/.env
    ports:
      - "8000:8000"   # optional: expose for local curl/healthz checks

  dops-assistant:
    build: .
    restart: "no"
    env_file: dev/.env
    environment:
      CONFIG_PATH: /app/config.yaml
      LOG_LEVEL: debug
      GRAFANA_MCP_URL: http://grafana-mcp:8000/mcp
    volumes:
      - ./dev/config.yaml:/app/config.yaml:ro
    ports:
      - "9090:9090"
    depends_on:
      - grafana-mcp
