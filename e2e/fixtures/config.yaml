# Minimal e2e fixture config. CI reads this via CONFIG_PATH. Local dev uses dev/config.yaml.
llm:
  model: gpt-oss-120b
  apiKey: ${OPENAI_API_KEY:-dummy-ci-key}
  baseURL: ${OPENAI_API_URL:-http://127.0.0.1:9999/v1}

providers: []
services: []

discovery:
  autoRefresh: false

agent:
  maxIterations: 5
  # Surface the Deep Investigation entry for the e2e flow. The run itself is
  # driven by the deterministic stub (DEEP_INVESTIGATION_E2E_STUB=1), not a real
  # LLM/MCP engine, so no provider is required.
  autonomousInvestigationEnabled: true
  challengeEnabled: true

memory:
  storage: memory

timeouts:
  mcpConnectMs: 5000
  llmCallMs: 10000
  toolExecutionMs: 10000

retry:
  maxAttempts: 1
  baseDelayMs: 500
